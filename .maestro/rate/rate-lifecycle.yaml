# Rate Modal — Real Screen, Real Write
# Verifies: app/rate/[showId].tsx (the production rating screen, not the
# app/test/show-rating-fixture.tsx local-state fixture the 6 existing
# "show-rating" flows drive) actually writes a rating to Supabase.
#
# app/rate/[showId].tsx had zero coverage (audited 2026-08-12, see
# memory/testing.md) despite doing a real Supabase write for every rating a
# real user saves.
#
# Scope note (2026-08-13): this flow originally also verified the write by
# navigating back to the show page and editing/deleting the rating there —
# dropped after two CI dispatches (31656094911, 31656096518) both showed,
# via downloaded screenshots, that scrolling the show page after a
# tap-navigation lands back on the Browse tab instead (see
# .maestro/show/show-detail.yaml's header comment for the full account).
# Diagnosing an iOS gesture interaction needs a simulator in front of a
# person, not another blind CI round. What's left: this flow proves the
# Save button on the real screen performs a real write (the toast is a
# claim the client made — CI-level cleanup below is the actual proof
# nothing gets left behind).
#
# Deep-linked instead of tapped through Browse search — sidesteps the
# navigation issue above entirely (this flow's own dispatches hit it too,
# at the identical spot, before this rewrite) and is a pattern already used
# everywhere else in this repo.
#
# Discovered 2026-08-13: the dev-test CI account already has a real 5-star
# Hamilton rating from before this session (visible in a tapped element's
# accessibility dump — "Your rating: 5.0 stars" — not created by any of this
# flow's own runs, none of which had reached Save yet). "reviews" has no
# unique constraint, so this flow's write is always an ADDITIONAL viewing,
# never assumed to be the only one — it doesn't touch or depend on whatever
# else is already on the account.

appId: com.broadwayscorecard.app
---
- launchApp

- tapOn:
    text: "Open"
    optional: true

- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 30000

# Force-resolve auth via a screen that visibly distinguishes signed-in from
# signed-out (ShowPageRating renders its stars either way — see
# components/user/ShowPageRating.tsx — so it can't be used for this check).
- tapOn: "Profile and settings"

- extendedWaitUntil:
    visible: "ACCOUNT"
    timeout: 15000

- extendedWaitUntil:
    visible: "Sign Out"
    timeout: 20000

# Relaunch: the session is now cached locally, so this restart resolves
# auth from storage instead of the slower network sign-in path.
- launchApp

- tapOn:
    text: "Open"
    optional: true

- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 30000

# "Broadway Scorecard" (the brand header) can render before the router has
# finished mounting/hydrating enough to handle a deep link — confirmed
# 2026-08-13 (run 31665997151, screenshot showed the openLink below landing
# on plain Home instead of the rate screen, no error, just silently
# ignored). Waiting for real content data (not just static brand text) is a
# better readiness signal.
- extendedWaitUntil:
    visible: "Top Shows"
    timeout: 30000

# No reviewId param — always opens a fresh "new viewing" entry, same as
# tapping an interactive star or "+ New Viewing" would, regardless of
# whether Hamilton already has a rating on this account.
- openLink: broadwayscorecard://rate/hamilton-2015?showTitle=Hamilton
- tapOn:
    text: "Open"
    optional: true

- assertVisible: "Your rating for"

- tapOn:
    id: "star-4"

# Tap the input's own accessibilityLabel, not the adjacent field-label Text
# ("Private Notes (optional)") — that label isn't the TextInput (codex
# review, 2026-08-12). Needs a wildcard, not the bare label: confirmed via a
# downloaded screen-hierarchy dump (2026-08-13, run 31660024187) that iOS
# concatenates the label with the placeholder into one accessibility string,
# "Private notes What did you think?" — the exact substring-vs-full-match
# trap .maestro/README.md already documents for assertVisible, which
# apparently applies to tapOn too.
- tapOn: "Private notes.*"
- inputText: "MAESTRO E2E — safe to delete"

- tapOn: "Save"

# Not asserting the "Rating saved" toast text: confirmed via a downloaded
# screenshot (2026-08-13, run 31663575924) that Save correctly closes the
# modal and lands back on a real, stable screen (Home) — no crash, no error
# banner — but the toast itself (a 3s default duration) wasn't reliably
# caught here, most likely because this flow deep-links in cold (no real
# screen to return to), so Save's router.back() resets to the Home tab
# instead of a normal pop, and that reset competes with the toast for the
# same render pass. Asserting a stable landing screen instead is the robust
# check; the CI workflow's backstop cleanup step (maestro-e2e.yml, "Clean up
# rate-lifecycle review row") deletes this row by show_id + review_text
# after every run — if that step ever finds nothing to delete, the write
# didn't happen; finding and deleting a row every run is the real proof.
- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 15000
