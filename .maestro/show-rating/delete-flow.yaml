# Show Page Rating — Delete Flow
# Verifies: tap Delete → reset to empty state
# Fixture: /test/show-rating-fixture?state=existing

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard://test/show-rating-fixture?state=existing
- tapOn:
    text: "Open"
    optional: true

# Existing review should show delete button
- assertVisible: "Delete rating"

# Tap delete
- tapOn: "Delete rating"

# After delete, should reset to empty state (interactive stars, no edit/delete)
- assertVisible: "1 star"
- assertVisible: "5 stars"
- assertNotVisible: "Edit rating"
