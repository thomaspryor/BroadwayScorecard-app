# My Shows Import — Real Mezzanine JSON file, end-to-end (task #436)
# Drives the actual document-picker + file-parse + match + bulk-insert path,
# not just "the screen renders". Requires a local HTTP server serving
# .maestro/fixtures/mezzanine-import.json with a Content-Disposition:
# attachment header on http://localhost:8931/ — a raw filesystem copy into
# the simulator's Downloads folder is NOT picked up by the document picker;
# only a real Safari-initiated download registers it (see maestro-e2e.yml).
# Fixture is deliberately small + stable against the shared dev-test account:
#   - Titanique: real, matched, rated → inserted into reviews, then deleted
#     by the workflow's cleanup step (reviews has no unique constraint, so
#     repeat CI runs would otherwise pile up duplicate rows forever).
#   - Zorbatron: A New Musical: fake title → always unmatched.
#   - Buena Vista Social Club: real, but already a permanent seed row in
#     dev-test's watchlist → always skipped as "already in your shows",
#     no cleanup needed (watchlist DOES have a DB unique constraint).

appId: com.broadwayscorecard.app
---
# Put the fixture into On My iPhone > Downloads with a real Safari download.
# maestro-e2e.yml serves it, but until 2026-10-20 no step ever fetched it, so
# the picker showed "On My iPhone is Empty" and this flow failed every night.
# localhost is not a claimed universal link, so openLink lands in Safari.
- openLink: http://localhost:8931/mezzanine-import.json
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Download"
    timeout: 15000
- tapOn: "Download"
- waitForAnimationToEnd:
    timeout: 5000
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///import
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Import your shows"
    timeout: 60000
- tapOn: "Choose JSON File"
# The system document picker runs out of process and took >10 s to show its
# tab bar on the CI simulator (run 39521528670: "Browse" was on screen in the
# failure screenshot after an 11.5 s wait; launchApp alone took 94 s there).
- extendedWaitUntil:
    visible: "Browse"
    timeout: 30000
- tapOn: "Browse"
- extendedWaitUntil:
    visible: "On My iPhone"
    timeout: 10000
- tapOn: "On My iPhone"
- extendedWaitUntil:
    visible: "Downloads"
    timeout: 10000
- tapOn: "Downloads"
# Grid cells in the iOS 26 picker sometimes only highlight on the first tap.
# Run 39671117465 stayed on On My iPhone ("Downloads, 1 item" still showing);
# the point taps below used to hide that by opening the folder themselves.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Downloads, \\d+ items?"
    commands:
      - tapOn:
          text: "Downloads, \\d+ items?"
          optional: true  # the first tap may land mid-navigation
# An unfinished Safari download shows as a greyed "<name>.download" cell that
# cannot be opened (run 39645448024 stopped here at 0%). Wait for the cell to
# render first so the notVisible check below cannot pass on an empty grid.
- extendedWaitUntil:
    visible: ".*mezzanine-import.*"
    timeout: 10000
- extendedWaitUntil:
    notVisible: ".*mezzanine-import\\.json\\.download.*"
    timeout: 30000
# Fresh CI install → Downloads has exactly this one fixture file. The first
# tap on a grid cell sometimes only highlights it instead of opening it
# (observed live, not consistently reproducible) — a second tap at the same
# point is a safe no-op once Review Import is already showing, since that
# point lands on plain summary text there, not a checkbox row.
- tapOn:
    point: "71,306"
- tapOn:
    point: "71,306"
    optional: true
- extendedWaitUntil:
    visible: "Review Import"
    timeout: 20000

# Real parse + real matchShow() ran — verify the three outcomes:
- assertVisible: "1 not on Broadway Scorecard"
- assertVisible: "Diary — 1 of 1 selected"
- assertVisible: "Watchlist — 0 of 1 selected"
# Each row is one composite accessibility element (checkbox + title + rating
# + context all joined) — assertVisible requires a full match, so substring
# selectors need a wildcard (see .maestro/README.md).
- assertVisible: ".*Titanique.*"
- assertVisible: ".*Zorbatron: A New Musical.*"
- assertVisible: ".*Buena Vista Social Club.*"

# Real bulk insert against Supabase.
- tapOn: "Import 1 Show"
- extendedWaitUntil:
    visible: "Import Complete"
    timeout: 20000
- assertVisible: "1 shows imported"
# Copy changed in d3b8df3 (flagged rows get a fix-up list); the old
# "Not imported — 1 show we couldn't find" line no longer exists.
- assertVisible: "Still to fix — 1 show"
