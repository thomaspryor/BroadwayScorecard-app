# My Shows — Add Show Button
# Verifies: "Rate a show" card visible at bottom of diary

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# The footer card in diary mode
- extendedWaitUntil:
    visible: "Rate a show"
    timeout: 60000
