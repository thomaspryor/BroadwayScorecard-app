# My Shows — Watchlist Tab
# Verifies: watchlist tab loads and sort button works

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Switch to watchlist tab
- tapOn:
    text: "Watchlist.*"

# Sort button should be watchlist-specific
- assertVisible:
    text: "Sort watchlist.*"
