# My Shows — Diary List View
# Verifies: diary tab loads with entries and stats

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Diary tab active
- extendedWaitUntil:
    visible: "Diary"
    timeout: 60000

# Sort button visible
- assertVisible:
    text: "Sort diary.*"
