# My Shows — Tab Switching
# Verifies: Diary ↔ Watchlist switching works

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Start on Diary tab
- assertVisible: "Diary"

# Switch to Watchlist
- tapOn:
    text: "Watchlist.*"
- assertVisible:
    text: "Sort watchlist.*"

# Switch back to Diary
- tapOn: "Diary"
- assertVisible:
    text: "Sort diary.*"
