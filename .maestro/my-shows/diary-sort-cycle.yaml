# My Shows — Diary Sort Cycling
# Verifies: sort button cycles Newest → Oldest → Top Rated → Newest

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Start on diary — default sort is "Newest"
- extendedWaitUntil:
    visible: "Diary"
    timeout: 60000
- assertVisible:
    text: "Sort diary, Newest"

# Tap sort → Oldest
- tapOn:
    text: "Sort diary.*"
- assertVisible:
    text: "Sort diary, Oldest"

# Tap sort → Top Rated
- tapOn:
    text: "Sort diary.*"
- assertVisible:
    text: "Sort diary, Top Rated"

# Tap sort → back to Newest
- tapOn:
    text: "Sort diary.*"
- assertVisible:
    text: "Sort diary, Newest"
