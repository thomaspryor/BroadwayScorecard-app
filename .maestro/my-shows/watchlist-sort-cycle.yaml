# My Shows — Watchlist Sort Cycling
# Verifies: sort button cycles Recent → A-Z → Closing Soon → Recent

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Switch to watchlist
- tapOn:
    text: "Watchlist.*"
- assertVisible:
    text: "Sort watchlist, Recent"

# Tap sort → A-Z
- tapOn:
    text: "Sort watchlist.*"
- assertVisible:
    text: "Sort watchlist, A-Z"

# Tap sort → Closing Soon
- tapOn:
    text: "Sort watchlist.*"
- assertVisible:
    text: "Sort watchlist, Closing Soon"

# Tap sort → back to Recent
- tapOn:
    text: "Sort watchlist.*"
- assertVisible:
    text: "Sort watchlist, Recent"
