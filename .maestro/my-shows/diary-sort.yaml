# My Shows — Diary Sort
# Verifies: sort button cycles through options

appId: com.broadwayscorecard.app
---
- launchApp
# Wait for the tab bar before the deep link: app/_layout.tsx renders nothing
# until its startup checks finish, and a link that arrives earlier is dropped.
- extendedWaitUntil:
    visible: "Watched"
    timeout: 60000
- openLink: broadwayscorecard:///my-shows
- tapOn:
    text: "Open"
    optional: true

# Diary tab with sort button
- assertVisible: "Diary"
- assertVisible:
    text: "Sort diary.*"

# Tap sort button to cycle
- tapOn:
    text: "Sort diary.*"
