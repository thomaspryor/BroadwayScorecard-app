# My Shows — Photo Feed privacy affordances (task #571)
# Verifies: Feed segment shows "Only you" lock pill + Timeline/Photo wall toggle.
# Cross-account RLS enforcement is proven separately (blocking, API-level) by
# tests/security/photo-rls-adversarial.test.mjs — this flow only checks that
# the UI's privacy affordances actually render for a signed-in user.

appId: com.broadwayscorecard.app
---
- launchApp
# /watched, not the legacy /my-shows route. `diary-list-view-toggle` lives in
# app/(tabs)/watched.tsx; app/my-shows.tsx has only the older `view-toggle` id.
# This flow kept opening the legacy route after the diary moved, so it failed
# every run — invisibly, because the E2E suite was dispatch-only until
# 2026-08-12 and nobody dispatched it. Caught by the first nightly run
# (31571886484). stats-capture.yaml already targets /watched correctly.
- openLink: broadwayscorecard:///watched
- tapOn:
    text: "Open"
    optional: true

- tapOn:
    id: "diary-list-view-toggle"

- assertVisible: "Only you"
- assertVisible: "Timeline"
- assertVisible: "Photo wall"

- tapOn: "Photo wall"
- assertVisible:
    id: "photo-feed-wall-toggle"
