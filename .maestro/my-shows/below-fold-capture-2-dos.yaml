appId: com.broadwayscorecard.app
---
- launchApp
- tapOn:
    text: "Open"
    optional: true
- openLink: broadwayscorecard:///test/show-below-fold-variants
- extendedWaitUntil:
    visible:
      id: "bf-cast-variant-current"
    timeout: 25000
- tapOn:
    id: "bf-show-tab-deathOfASalesman"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "bf-distribution-content"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: "32-dos-distribution-current"
- tapOn:
    id: "bf-distribution-variant-webParity"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "33-dos-distribution-webparity"
- scrollUntilVisible:
    element:
      id: "bf-scorecard-content"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "bf-scorecard-variant-carded"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "34-dos-scorecard-carded"
- scrollUntilVisible:
    element:
      id: "bf-tickets-content"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: "35-dos-tickets-current"
- tapOn:
    id: "bf-tickets-variant-pillRow"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "36-dos-tickets-pillrow"
