# Screenshot capture for show-page below-the-fold design proposals, part 2 (#865).
# Covers the 5 new sections added on top of the #595 fixture: score
# distribution, Critics' Take, critic scorecard/review rows, synopsis, and
# ticket CTAs. Each block re-opens the deep link fresh (resets scroll to
# top) before tapping its target variant, avoiding a flaky
# scroll-back-to-top-then-tap (same pattern as below-fold-capture.yaml).
#
# GOTCHA (found 2026-08-02, same bug class as the #595 Audience defect):
# scrollUntilVisible must target the *-content wrapper id (with
# centerElement: true), NOT the *-variant-current segmented-control button.
# Adjacent sections sit close enough together that the button is often
# already on-screen without any scroll, so scrolling-to-the-button silently
# no-ops and the next screenshot duplicates the previous one byte-for-byte
# (verified via md5) while the caption still claims it shows the new
# section's rendered content.
appId: com.broadwayscorecard.app
---
- launchApp
- tapOn:
    text: "Open"
    optional: true

# ── Hamilton: Score Distribution ──
- openLink: broadwayscorecard:///test/show-below-fold-variants
- extendedWaitUntil:
    visible:
      id: "bf-cast-variant-current"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "bf-distribution-content"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: "20-hamilton-distribution-current"
- tapOn:
    id: "bf-distribution-variant-webParity"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "21-hamilton-distribution-webparity"

# ── Hamilton: Critics' Take ──
- scrollUntilVisible:
    element:
      id: "bf-criticstake-content"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: "22-hamilton-criticstake-current"
- tapOn:
    id: "bf-criticstake-variant-minimal"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "23-hamilton-criticstake-minimal"

# ── Hamilton: Critic Scorecard / Review Rows ──
