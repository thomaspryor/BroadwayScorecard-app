# Bookmark Toggle Test — Browse Tab
# Verifies: tapping bookmark overlay doesn't crash, toggles watchlist state
# Tests Gate 2 (async error handling) and Gate 4 (auth handling)
# BRO-270: scrolls to the first unrated card instead of assuming index 0 is
# unrated — see the scrollUntilVisible step below for why.

appId: com.broadwayscorecard.app
---
- launchApp

# Dismiss iOS "Open in" dialog if present
- tapOn:
    text: "Open"
    optional: true

# Wait for app to load (home is default tab)
- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 30000

# Navigate to Browse tab. NativeTabs renders this as an icon-only floating
# pill (role="search", no visible label) but still exposes accessibilityText
# "Browse" — confirmed via `maestro hierarchy` against a local simulator build.
- tapOn:
    text: "Browse"

# Wait for browse page data to load. This is the first flow to run
# alphabetically in the suite, so it eats the cold-start network/JS-init
# penalty other flows don't — 30s timeout was observed failing by ~3s on a
# real CI run (2026-07-20, run 29758666103); other tabs flows load the same
# data near-instantly once warm.
- extendedWaitUntil:
    visible: "Now Playing"
    timeout: 45000

# Scroll until an unrated show card is on screen. The shared CI dev-test
# account accumulates real ratings over time (BRO-270: Hamilton, Book of
# Mormon, Oh Mary!, Chicago were all rated, permanently red-ing this flow) —
# BookmarkOverlay renders testID "my-rating-chip" instead of
# "bookmark-overlay" for any show the signed-in user has rated, and the
# FlatList only renders the first few cards, so a fixed index 0 can end up
# with zero "bookmark-overlay" matches anywhere in the current view. Scrolling
# until one is visible is immune to however many top cards happen to be
# rated, without touching the account's rating data.
- scrollUntilVisible:
    element:
      id: "bookmark-overlay"
    direction: DOWN
    timeout: 20000

# Tap the bookmark overlay on the first unrated show card now on screen
# Uses testID since iOS collapses nested Pressable accessibility labels
- tapOn:
    id: "bookmark-overlay"
    index: 0

# Should NOT see an error banner
- extendedWaitUntil:
    notVisible: "Uncaught.*promise"
    timeout: 5000

# Tap it again to toggle back
- tapOn:
    id: "bookmark-overlay"
    index: 0

# Verify no error
- extendedWaitUntil:
    notVisible: "Uncaught.*promise"
    timeout: 5000

# Verify the browse page is still showing (didn't crash)
- assertVisible: "Now Playing"
