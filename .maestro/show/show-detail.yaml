# Show Detail Page — Tap-Through + Render Check
# Verifies: Browse search actually opens a show (not just the results list),
# and the show page renders its score, critic reviews and ticket CTA.
#
# app/show/[slug].tsx had zero E2E coverage before this flow — Browse and
# search stopped at the results list (audited 2026-08-12, see memory/testing.md).
# Uses Hamilton because .maestro/tabs/search.yaml already depends on it
# staying in the catalog; same assumption, not a new one.

appId: com.broadwayscorecard.app
---
- launchApp

- tapOn:
    text: "Open"
    optional: true

- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 30000

- tapOn:
    text: "Browse"

- extendedWaitUntil:
    visible: "Now Playing"
    timeout: 30000

- tapOn: "Search shows..."
- inputText: "Hamilton"

- extendedWaitUntil:
    visible: "\\d+ results? for .*"
    timeout: 15000

# Tap the first result — proves ShowCard -> router.push(/show/[slug]) actually
# navigates, not just that the results list renders.
- tapOn:
    id: "show-card-result"

# Title + score badge are in the hero, on screen without scrolling — proves
# real navigation landed on the real show page with real data.
- extendedWaitUntil:
    visible: "Hamilton"
    timeout: 20000
- assertVisible:
    text: "Score \\d+.*"

# Get Tickets, the rating widget, and critic reviews all sit BELOW the hero
# on a real device, and scrolling down to them is where this flow stops.
# Confirmed twice with actual CI screenshots (2026-08-13, runs 31656094911
# and 31656096518, both via `gh run download -n maestro-test-results`): right
# after this exact tap-navigation, a scrollUntilVisible/scroll gesture on
# this screen ends with the app back on the Browse tab, search cleared —
# title/score had JUST asserted true, so the show page genuinely loaded; the
# scroll gesture itself is what triggers a return to Browse. Most likely
# cause: show/[slug].tsx is a pushed stack screen with iOS's interactive
# swipe-to-go-back gesture enabled by default, and Maestro's scroll swipe
# starts close enough to the left edge to be read as that gesture instead of
# a content scroll — a known category of Maestro/React Navigation
# interaction, not something guessable from a log alone.
#
# Deliberately not chased further here — the previous fix for a different
# problem (a too-short wait) took two dispatch rounds to disprove, and this
# one needs a simulator in front of a person to watch the actual gesture,
# not another blind CI round. Left for a future session. Coverage stops at
# proving Browse search navigates to the real show page with the real score;
# the ticket CTA, rating widget and critic reviews are unverified past that.
