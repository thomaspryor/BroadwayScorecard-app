# Show Detail Page — Tap-Through + Render Check
# Verifies: Browse search actually opens a show (not just the results list),
# and the show page renders its score, critic reviews and ticket CTA.
#
# app/show/[slug].tsx had zero E2E coverage before this flow — Browse and
# search stopped at the results list (audited 2026-08-12, see memory/testing.md).
# Uses Hamilton because .maestro/tabs/search.yaml already depends on it
# staying in the catalog; same assumption, not a new one.

appId: com.broadwayscorecard.app
---
- launchApp

- tapOn:
    text: "Open"
    optional: true

- extendedWaitUntil:
    visible: "Broadway Scorecard"
    timeout: 30000

- tapOn:
    text: "Browse"

- extendedWaitUntil:
    visible: "Now Playing"
    timeout: 30000

- tapOn: "Search shows..."
- inputText: "Hamilton"

- extendedWaitUntil:
    visible: "\\d+ results? for .*"
    timeout: 15000

# Tap the first result — proves ShowCard -> router.push(/show/[slug]) actually
# navigates, not just that the results list renders.
- tapOn:
    id: "show-card-result"

# Title + score badge are in the hero, on screen without scrolling.
- extendedWaitUntil:
    visible: "Hamilton"
    timeout: 20000
- assertVisible:
    text: "Score \\d+.*"

# Get Tickets, the rating widget, and critic reviews all sit BELOW the hero
# on a real device — confirmed the hard way (2026-08-13 dispatch): a bare
# assertVisible/extendedWaitUntil for "Get Tickets" failed even after 17s,
# not because it was slow to render (title/score above asserted instantly)
# but because it was never scrolled into the viewport. Widening a wait can't
# fix a missing scroll — assertVisible/extendedWaitUntil only see what's
# currently on screen; scrollUntilVisible is the command that moves the
# viewport, same as .maestro/my-shows/stats-tab.yaml already does for the
# same reason.
- scrollUntilVisible:
    element:
      text: "Get Tickets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 20

# Rating widget renders unconditionally once the show resolves — proves the
# show page, not some other screen, is what's on screen.
- scrollUntilVisible:
    element:
      text: "MY RATING & REVIEW"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 20

# Critic reviews come from a separate per-show CDN fetch, further down still.
- scrollUntilVisible:
    element:
      text: "Critic Scorecard"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 20
