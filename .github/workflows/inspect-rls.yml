name: Inspect RLS state

# READ-ONLY. Dumps the RLS flags, policies and table grants for one table, so a
# security question can be answered by looking rather than by guessing.
# SUPABASE_ACCESS_TOKEN is a repository secret, so this cannot be run locally.
on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table in the public schema (e.g. push_tokens)'
        required: true
        type: string
        default: push_tokens

jobs:
  inspect:
    name: Inspect RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reviewed code only — this holds the management token. See
    # apply-migration.yml.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump RLS state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Environment, not interpolation — see apply-migration.yml for why.
          TABLE: ${{ inputs.table }}
        run: node scripts/inspect-rls.js "$TABLE"
