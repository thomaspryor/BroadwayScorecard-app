name: Apply Supabase migration

# Manual only, one migration per press. There is no schedule and no push
# trigger: this writes to the production database, and the whole point is that
# a human decides when. SUPABASE_ACCESS_TOKEN lives only here as a repository
# secret, which is why applying a migration cannot be done from a local session.
#
# The run log contains the full SQL that was executed (scripts/apply-migration.js
# prints it before running), so this workflow's history IS the record of what
# has been applied and when.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Filename inside supabase/migrations/ (e.g. 20260812013000_push_tokens_owner_insert.sql)'
        required: true
        type: string
      confirm:
        description: 'Actually run it. Leave unchecked for a dry run that only prints the SQL.'
        required: true
        type: boolean
        default: false

concurrency:
  group: supabase-migration
  cancel-in-progress: false

jobs:
  apply:
    name: ${{ inputs.confirm && 'APPLY' || 'Dry run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only ever runs the migration and script as they exist on main. A
    # workflow_dispatch lets the dispatcher pick ANY ref, and checkout would
    # then run that branch's version of apply-migration.js against production
    # with the management token — the filename guard inside the script is
    # worthless if the script itself is attacker-chosen. Reviewed code only.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Passed through the environment, NOT interpolated into the script.
          # `${{ inputs.x }}` inside a run: block is substituted textually
          # before the shell sees it, so a crafted input escapes the quotes and
          # executes — the standard GitHub Actions script-injection hole, and
          # here it would run with a production database token in scope. The
          # Node-side basename guard cannot help: the injection fires first.
          MIGRATION: ${{ inputs.migration }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" = "true" ]; then
            node scripts/apply-migration.js "$MIGRATION" --confirm
          else
            node scripts/apply-migration.js "$MIGRATION"
          fi
