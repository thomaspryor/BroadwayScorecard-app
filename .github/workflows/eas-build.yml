name: Build iOS App
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force a native build even if only JavaScript changed (use when the owner should get a TestFlight notification to review)'
        type: boolean
        default: false
  schedule:
    # Every 6h: auto-build TestFlight when main has user-visible drift vs the
    # last production build (2026-07-24 build-54 incident: merged fixes sat
    # undelivered because builds were manual-only). Gate: scripts/check-testflight-drift.js
    - cron: '20 3,9,15,21 * * *'

# Never cancel-in-progress: cancelling the GH job does NOT cancel the EAS build,
# which would keep running and still auto-submit (web-repo cancel-cascade class).
concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  photo-security-gate:
    # BLOCKING (task #571) — runs on every trigger, including manual
    # workflow_dispatch (the TestFlight drift `gate` job below is
    # schedule-only per the 2026-07-27 auto-ship decision, but a brand-new
    # private-photo feature's RLS proof must never be skippable that way).
    name: Photo Feed security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit-test photo storage path (RLS-relevant pure logic)
        run: node --experimental-strip-types --test tests/unit/photo-path.test.mjs

      - name: Seed two-account photo RLS fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIXTURE_PHOTO_A_PASSWORD: ${{ secrets.FIXTURE_PHOTO_A_PASSWORD }}
          FIXTURE_PHOTO_B_PASSWORD: ${{ secrets.FIXTURE_PHOTO_B_PASSWORD }}
        run: node scripts/seed-photo-test-accounts.js

      - name: BLOCKING — two-account adversarial RLS test
        env:
          CI: 'true'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          FIXTURE_PHOTO_A_PASSWORD: ${{ secrets.FIXTURE_PHOTO_A_PASSWORD }}
          FIXTURE_PHOTO_B_PASSWORD: ${{ secrets.FIXTURE_PHOTO_B_PASSWORD }}
        run: node --test tests/security/photo-rls-adversarial.test.mjs

      - name: BLOCKING — diary-photos bucket must be Private
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-photo-bucket-private.js

  logic-gate:
    # Pure-logic unit tests, on EVERY trigger. The `gate` job below is
    # schedule-only, so anything tested there is unguarded on a manual
    # workflow_dispatch — which is how beta-feedback batches actually ship.
    name: Pure logic gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: these tests import the real .ts modules via
          # --experimental-strip-types (unavailable on 20)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit-test date math (closing-soon window, local-date persistence)
        run: node --experimental-strip-types --import ./tests/register-alias.mjs --test tests/unit/date-utils.test.mjs

      - name: Unit-test poster grid column math
        run: node --experimental-strip-types --import ./tests/register-alias.mjs --test tests/unit/poster-grid.test.mjs

      - name: Unit-test import matcher + diary catalog merge
        run: node --experimental-strip-types --import ./tests/register-alias.mjs --test tests/unit/show-match.test.mjs

      - name: Unit-test advanced filters
        run: node --experimental-strip-types --import ./tests/register-alias.mjs --test scripts/advanced-filters.test.mjs

      # Guards the OTA path against republishing the 2026-08-03 outage: an
      # update bundled with empty Supabase credentials installs an app that
      # launches and cannot sign in, and nothing else in CI notices.
      - name: Unit-test OTA credential guard
        run: node --test scripts/ship-credentials.test.mjs

      # The two ship-gating path lists must agree, or a native-only commit
      # decides should_build=false and nothing ships at all.
      - name: Unit-test ship path lists agree
        run: node --test scripts/ship-paths.test.mjs

      - name: Design floor (12pt minimum text size)
        run: npm run lint:design

  gate:
    name: TestFlight drift gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: advanced-filters test imports the real .ts module via
          # --experimental-strip-types (unavailable on 20)
          node-version: 22
          cache: npm

      - name: Install dependencies (pins eas-cli to package.json version)
        run: npm ci

      - name: Unit-test gate logic
        run: node --test scripts/check-testflight-drift.test.mjs

      # Vendored stats engine (lib/stats/) must match its checksum manifest.
      # The web-repo drift half auto-skips here (no Broadwayscore checkout on
      # the runner); the tamper half is what stops an edited vendored copy from
      # shipping to TestFlight.
      - name: Unit-test vendored stats engine drift
        run: node --test scripts/vendor-stats-lib.test.mjs

      # The overnight feedback autopilot auto-implements the OWNER's TestFlight
      # feedback but must never auto-implement anyone else's. That split is one
      # email comparison — test it here so it cannot regress unnoticed.
      - name: Unit-test beta-feedback approval gate
        run: node --test scripts/feedback/ledger.test.mjs

      # And the guard that stops an unattended run merging a native change,
      # which ship.js would then price at $1.85.
      - name: Unit-test beta-feedback native-path guard
        run: node --test scripts/feedback/overnight.test.mjs

      # Crash submissions' log text lives behind a separate ASC relationship
      # (task #1055) — locks the response-shape parsing and the ledger's
      # attachment of the log file alongside screenshots.
      - name: Unit-test beta-feedback crash log attachment
        run: node --test scripts/feedback/crashlog.test.mjs

      # The fail-closed decision that stops the overnight run merging a UI
      # change nobody looked at: no captured screenshot for a touched screen
      # means no merge, regardless of what the compile gates or the agent's
      # own report say.
      - name: Unit-test beta-feedback visual gate
        run: node --test scripts/feedback/visual-gate.test.mjs

      - name: Decide whether TestFlight drifted
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TESTFLIGHT_GATE_DISABLED: ${{ vars.TESTFLIGHT_GATE_DISABLED }}
        run: node scripts/check-testflight-drift.js

  # Ships main to TestFlight the CHEAPEST correct way: a native EAS build only
  # when the native fingerprint moved, otherwise a free over-the-air update.
  # Builds 66-72 shared one fingerprint — six consecutive $1.85 builds that
  # were JavaScript-only (owner, 2026-08-03: "this is getting expensive").
  build:
    name: Ship to TestFlight (build or OTA)
    needs: [photo-security-gate, logic-gate, gate]
    if: ${{ !cancelled() && needs.photo-security-gate.result == 'success' && needs.logic-gate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.should_build == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: scripts/ship.js diffs against the last build's commit.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Must run BEFORE the fingerprint is computed — it reflects installed
      # native state, not package.json.
      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > /tmp/AuthKey.p8

      - name: Ship (native build only if the fingerprint moved)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: node scripts/ship.js ${{ (github.event_name == 'workflow_dispatch' && (inputs.force_build == true || inputs.force_build == 'true')) && '--force-build' || '' }}
