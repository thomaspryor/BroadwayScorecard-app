name: Build iOS App
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force a native build even if only JavaScript changed (use when the owner should get a TestFlight notification to review)'
        type: boolean
        default: false
  schedule:
    # Every 6h: auto-build TestFlight when main has user-visible drift vs the
    # last production build (2026-07-24 build-54 incident: merged fixes sat
    # undelivered because builds were manual-only). Gate: scripts/check-testflight-drift.js
    - cron: '20 3,9,15,21 * * *'

# Never cancel-in-progress: cancelling the GH job does NOT cancel the EAS build,
# which would keep running and still auto-submit (web-repo cancel-cascade class).
concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  photo-security-gate:
    # BLOCKING (task #571) — runs on every trigger, including manual
    # workflow_dispatch (the TestFlight drift `gate` job below is
    # schedule-only per the 2026-07-27 auto-ship decision, but a brand-new
    # private-photo feature's RLS proof must never be skippable that way).
    name: Account data security gate
    runs-on: ubuntu-latest
    # Serialised against ci.yml's security job: both sign in as the SAME two
    # fixture accounts and write to the same rows. Two concurrent runs delete
    # each other's fixture list mid-test and fail for reasons unrelated to RLS.
    concurrency:
      group: supabase-fixture-accounts
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit-test photo storage path (RLS-relevant pure logic)
        run: node --experimental-strip-types --test tests/unit/photo-path.test.mjs

      - name: Seed two-account photo RLS fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIXTURE_PHOTO_A_PASSWORD: ${{ secrets.FIXTURE_PHOTO_A_PASSWORD }}
          FIXTURE_PHOTO_B_PASSWORD: ${{ secrets.FIXTURE_PHOTO_B_PASSWORD }}
        run: node scripts/seed-photo-test-accounts.js

      # The whole tests/security/ glob, not just the photo file. Naming one
      # file here is what left the account-data RLS test (watchlist, reviews,
      # lists, list_items, profiles, push_tokens) gating ci.yml only — and
      # nothing in this workflow depends on ci.yml, so a ship could proceed
      # with that gate red or never run (ship-check, 2026-08-12).
      - name: BLOCKING — two-account adversarial RLS tests
        env:
          CI: 'true'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          FIXTURE_PHOTO_A_PASSWORD: ${{ secrets.FIXTURE_PHOTO_A_PASSWORD }}
          FIXTURE_PHOTO_B_PASSWORD: ${{ secrets.FIXTURE_PHOTO_B_PASSWORD }}
        run: npm run test:security

      - name: BLOCKING — diary-photos bucket must be Private
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-photo-bucket-private.js

  logic-gate:
    # Pure-logic unit tests, on EVERY trigger. The `gate` job below is
    # schedule-only, so anything tested there is unguarded on a manual
    # workflow_dispatch — which is how beta-feedback batches actually ship.
    name: Pure logic gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: these tests import the real .ts modules via
          # --experimental-strip-types (unavailable on 20)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ONE glob-driven step, deliberately not a per-file list. The per-file
      # list this replaced had rotted: themes, stats-aisle-mates,
      # stats-scope-default and watchlist-slot were all committed as tests and
      # then never ran anywhere, because adding the file and adding the CI step
      # are two separate acts and only the first one is obvious (2026-08-11
      # audit). `npm run test:unit` globs tests/unit/**/*.test.mjs and
      # scripts/**/*.test.mjs, so a new test file is live the moment it lands.
      #
      # What this covers: date math and the closing-soon window, poster grid
      # column math, the import matcher and diary catalog merge, advanced
      # filters, the OTA credential guard (2026-08-03 outage — an update
      # bundled with empty Supabase credentials installs an app that cannot
      # sign in), agreement between the two ship-gating path lists, the
      # beta-feedback approval / native-path / crash-log / visual gates, the
      # web-parity diff, the TestFlight drift gate, and the vendored stats
      # engine checksum.
      - name: Unit + logic test suite
        run: npm run test:unit

      - name: Design floor (12pt minimum text size)
        run: npm run lint:design

  gate:
    name: TestFlight drift gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: advanced-filters test imports the real .ts module via
          # --experimental-strip-types (unavailable on 20)
          node-version: 22
          cache: npm

      - name: Install dependencies (pins eas-cli to package.json version)
        run: npm ci

      # No unit tests here any more. This job is schedule-only (line ~111), so
      # anything gated here alone is unguarded on the manual workflow_dispatch
      # that beta-feedback batches actually ship through. Every test that used
      # to live here — the drift-gate logic and the vendored stats-engine
      # checksum included — is now inside logic-gate's glob, which runs on
      # every trigger. This job decides drift and nothing else.

      - name: Decide whether TestFlight drifted
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TESTFLIGHT_GATE_DISABLED: ${{ vars.TESTFLIGHT_GATE_DISABLED }}
        run: node scripts/check-testflight-drift.js

  # Ships main to TestFlight the CHEAPEST correct way: a native EAS build only
  # when the native fingerprint moved, otherwise a free over-the-air update.
  # Builds 66-72 shared one fingerprint — six consecutive $1.85 builds that
  # were JavaScript-only (owner, 2026-08-03: "this is getting expensive").
  build:
    name: Ship to TestFlight (build or OTA)
    needs: [photo-security-gate, logic-gate, gate]
    if: ${{ !cancelled() && needs.photo-security-gate.result == 'success' && needs.logic-gate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.should_build == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: scripts/ship.js diffs against the last build's commit.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Must run BEFORE the fingerprint is computed — it reflects installed
      # native state, not package.json.
      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > /tmp/AuthKey.p8

      - name: Ship (native build only if the fingerprint moved)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: node scripts/ship.js ${{ (github.event_name == 'workflow_dispatch' && (inputs.force_build == true || inputs.force_build == 'true')) && '--force-build' || '' }}
