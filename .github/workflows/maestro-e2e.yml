name: Maestro E2E Tests
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - show-rating
          - my-shows
          - tabs
          - import
  # Nightly full run at 05:40 UTC (01:40 ET) - before the 09:20 UTC eas-build
  # drift check, so a regression is already visible when the auto-ship decides.
  # 27 Maestro flows existed for months as dispatch-only, which meant they ran
  # only when somebody remembered to run them (2026-08-11 audit). macOS runner
  # minutes are billed at 10x, but this repository is PUBLIC and public repos
  # get unmetered Actions minutes, so a nightly full E2E run is free.
  schedule:
    - cron: '40 5 * * *'

jobs:
  e2e:
    name: Maestro E2E (${{ inputs.suite || 'all' }})
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Schedule triggers carry no inputs, so `inputs.suite` is '' there.
      # Resolve the suite once here; without this every suite conditional
      # below evaluates false on the nightly run and it executes zero flows
      # while still reporting green.
      SUITE: ${{ inputs.suite || 'all' }}
      EXPO_PUBLIC_DEV_AUTO_SIGNIN: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (for Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['udid'])
                  sys.exit(0)
          " 2>/dev/null || true)

          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl create "Test iPhone" "iPhone 16 Pro" 2>/dev/null || true)
          fi

          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean

      - name: Cache Xcode build
        uses: actions/cache@v4
        with:
          path: ios/build
          key: xcode-build-v2-signed-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            xcode-build-v2-signed-${{ runner.os }}-

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build app for Simulator (Release — JS bundled)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BroadwayScorecard.xcworkspace \
            -scheme BroadwayScorecard \
            -sdk iphonesimulator \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ios/build \
            build \
            SENTRY_AUTH_TOKEN="" \
            2>&1 | tee /tmp/xcodebuild.log | tail -200

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Build errors ==="
          grep -A3 'error:' /tmp/xcodebuild.log | head -80 || tail -100 /tmp/xcodebuild.log

      - name: Install and launch app
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.broadwayscorecard.app
          sleep 5

      - name: Dismiss onboarding screen
        run: |
          maestro test .maestro/ci-skip-onboarding.yaml
          # Diagnostic screenshot after onboarding
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/app-screenshot.png || true

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: /tmp/app-screenshot.png
          retention-days: 3

      - name: Fixture canary (fast __DEV__/env-gate check)
        # Only show-rating/*.yaml exercises show-rating-fixture.tsx — scoped
        # to suites that actually use it so an unrelated regression here can't
        # fail my-shows/tabs runs (the exact false-coupling this canary exists
        # to prevent, just inverted).
        if: ${{ env.SUITE == 'all' || env.SUITE == 'show-rating' }}
        run: |
          if ! maestro test .maestro/ci-canary-show-rating-fixture.yaml; then
            echo "::error::show-rating-fixture route did not render — may indicate __DEV__/EXPO_PUBLIC_DEV_AUTO_SIGNIN gating regressed (task #432/#403), but could also be an unrelated routing/render issue"
            exit 1
          fi

      - name: Serve import fixture (real Safari download for the document picker)
        # Simulators don't pick up a raw filesystem copy into Downloads — only
        # a genuine Safari-initiated download registers with the document
        # picker's FileProvider index (verified live, task #436). Content-
        # Disposition forces Safari to prompt "Download" instead of rendering
        # the JSON inline.
        if: ${{ env.SUITE == 'all' || env.SUITE == 'import' }}
        run: |
          cat > /tmp/fixture_server.py <<'PY'
          import http.server, socketserver
          class Handler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Content-Disposition', 'attachment; filename="mezzanine-import.json"')
                  super().end_headers()
          with socketserver.TCPServer(("", 8931), Handler) as httpd:
              httpd.serve_forever()
          PY
          cd .maestro/fixtures && nohup python3 /tmp/fixture_server.py > /tmp/fixture_server.log 2>&1 &
          sleep 1
          curl -sf http://localhost:8931/mezzanine-import.json > /dev/null

      - name: Run Maestro tests
        run: |
          case "$SUITE" in
            all)          PATTERN=".maestro/**/*.yaml" ;;
            show-rating)  PATTERN=".maestro/show-rating/*.yaml" ;;
            my-shows)     PATTERN=".maestro/my-shows/*.yaml" ;;
            tabs)         PATTERN=".maestro/tabs/*.yaml" ;;
            import)       PATTERN=".maestro/import/*.yaml" ;;
          esac

          FAILED=0
          for f in $PATTERN; do
            echo "=== Running $f ==="
            if ! maestro test "$f"; then
              FAILED=$((FAILED + 1))
              echo "FAILED: $f"
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/
          retention-days: 7

      - name: Clean up import-fixture review row
        # reviews has no unique constraint (multiple viewings per show are
        # allowed by design — task #436) so a repeat "Titanique" insert every
        # run would pile up duplicate rows on the shared dev-test account
        # forever. Delete by show_id + the fixture's exact date_seen, so a
        # real dev-test Titanique review on any other date survives.
        if: always() && (env.SUITE == 'all' || env.SUITE == 'import')
        run: |
          curl -s -X DELETE \
            "${EXPO_PUBLIC_SUPABASE_URL}/rest/v1/reviews?show_id=eq.titanique-2026&date_seen=eq.2026-05-05" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || true
